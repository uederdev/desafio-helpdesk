spring:
  application:
    name: helpdesk
  datasource:
    url: jdbc:postgresql://${DB_SERVER}:${DB_PORT}/${DB_NAME}
    password: ${DB_PASSWORD}
    username: ${DB_USER}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database: POSTGRESQL
  config:
    import: optional:file:.env[.properties]
server:
  port: 8080

